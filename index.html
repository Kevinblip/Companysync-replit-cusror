    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="CompanySync is an all-in-one roofing business management platform. Manage leads, customers, estimates, invoices, crews, and projects — with AI-powered roof measurements and damage inspection built in." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="CompanySync - Roofing Business Management" />
    <meta property="og:description" content="All-in-one CRM, estimating, invoicing, and crew management for roofing contractors. Powered by AI." />

    <meta property="og:url" content="https://getcompanysync.com/" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="CompanySync" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>CompanySync - Roofing Business Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(registration) {
            registration.addEventListener('updatefound', function() {
              var newWorker = registration.installing;
              newWorker.addEventListener('statechange', function() {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  window.dispatchEvent(new Event('sw-update-available'));
                }
              });
            });
          }).catch(function(err) {
            console.warn('[SW] Registration failed:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

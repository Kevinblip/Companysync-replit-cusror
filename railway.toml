# Railway config-as-code for the CompanySync web app (ignored by Replit).
# Replit keeps using .replit [deployment] and scripts/start-production.sh.
# This file only affects Railway.
#
# Do not set PORT here. Railway injects PORT and prod-server.cjs listens on it.
[build]
builder = "RAILPACK"
buildCommand = "npm run build"

[deploy]
# Schema setup finishes before the server process starts. The Replit start
# script looks for Node inside /nix/store, which does not exist on Railway.
startCommand = "node scripts/ensure-schema.cjs && node prod-server.cjs"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
